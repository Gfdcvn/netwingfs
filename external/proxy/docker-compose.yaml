services:
  haproxy:
    image: haproxy:3.3.6
    container_name: haproxy
    restart: always
    ports:
      - "6809:6809"
      - "6820:6820"
      - "6808:6808"
      - "10022:10022"
      - "30033:30033"
      - "10080:10080"
    volumes:
      - /store/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    networks:
      - main

  udplex:
    image: ghcr.io/tao08141/udplex:latest
    container_name: udplex
    restart: always
    ports:
      - "9987:9987/udp"
      - "6807:6807/udp"
    volumes:
      - /store/udplex/udplex.cfg:/app/config.yaml
    networks:
      - main

networks:
  main:
    external: true